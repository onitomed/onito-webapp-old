<label class='value' for="p">Select Patient</label>
<select class='form-control' name="p" id="p" [(ngModel)]="patientSm" (ngModelChange)="onChange($event)">
    <option value="" disabled>Select Patient</option>
    <option *ngFor="let patient of patients" [ngValue]="patient.name">{{patient.name}}</option>
</select>
