<h1>
    User Profile
</h1>

<app-selectpatient></app-selectpatient>



<h3 class="field">User ID: <div class="value">{{ user._id }}</div></h3>
<h3 class="field">User Name: <div class="value">{{ user.name }}</div></h3>
<h3 class="field">User Role: <div class="value">{{ user.roles[user.roles.length-1] | titlecase }}</div></h3>
<h3 class="field">User Email: <div class="value">{{ user.email }}</div></h3>
