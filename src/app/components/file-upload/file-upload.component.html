<input type="file" class="file-upload" name="file" id="file" class="myclass" accept=".pdf" (change)="handleFileInput($event)"/>
<label for="file">Choose a file</label>
<div *ngIf="fileToUpload">
    <!-- Display file details -->
    <section class="file-details">
      <h3>Report Details:</h3>
      <ul>
        <li><strong>Filename:</strong> {{fileToUpload?.name}}</li>
        <li><strong>File Type:</strong> {{fileToUpload?.type}}</li>
        <li><strong>File Size:</strong> {{fileToUpload?.size}} bytes</li>
      </ul>
    </section>
<app-button text="Upload" color="dark blue" (btnClick)="uploadFile()"></app-button><app-spinner *ngIf="isLoading"></app-spinner><div class="alert alert-success" *ngIf="uploadStatus === 'completed'">Upload done</div></div>
